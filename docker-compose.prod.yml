services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pbk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?wajib diisi di .env}
      POSTGRES_DB: pbk
      TZ: Asia/Jakarta
    volumes:
      - pbk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pbk -d pbk"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    # Targets the "builder" stage, not the default final stage ("runner").
    # The runner stage COPYs only .next/standalone — it has no prisma/
    # directory, no prisma.config.ts, and none of the devDependencies
    # (prisma CLI, tsx) that `prisma migrate deploy` and `prisma db seed`
    # need. The builder stage has the full repo and a full npm ci install,
    # so it has all of that.
    build:
      context: .
      target: builder
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    environment:
      DATABASE_URL: postgresql://pbk:${POSTGRES_PASSWORD}@db:5432/pbk?schema=public
      # This service runs `prisma db seed`, and the seed refuses to run
      # without SEED_ADMIN_PASSWORD — there is deliberately no default
      # password. Compose only passes a variable a service names, so without
      # this line the very first deploy fails at seed time.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?wajib diisi di .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?wajib diisi di .env — hasilkan dengan openssl rand -base64 32}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pbk:${POSTGRES_PASSWORD}@db:5432/pbk?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?wajib diisi di .env}
      # Required at runtime: TOTP secrets are stored encrypted, so without
      # this the app throws the moment anyone enrols or uses 2FA.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?wajib diisi di .env — hasilkan dengan openssl rand -base64 32}
      # Optional: empty means WhatsApp OTP is unavailable and TOTP is the only
      # second factor. Left blank rather than required so a school without a
      # gateway can still deploy.
      WA_BASE_URL: ${WA_BASE_URL:-}
      WA_API_KEY: ${WA_API_KEY:-}
      WA_INSTANCE: ${WA_INSTANCE:-}
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
      TZ: Asia/Jakarta
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?wajib diisi di .env}
    volumes:
      # Caddyfile (bawaan) mengambil sertifikat HTTPS sendiri, untuk DNS yang
      # langsung mengarah ke server. Caddyfile.tunnel untuk Cloudflare Tunnel.
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  pbk-pgdata:
  caddy-data:
  caddy-config:
